name: Integration

# Heavy tier (see docs/ci-cd.md): brings up the real docker-compose.yml stack (db + app +
# frontend) and runs every test that Backend CI deliberately excludes -- the real-Postgres
# suite (tests/**/test_integration.py plus the individually-deselected tests documented in
# backend.yml) and the streaming integration tests -- against that real, running stack.
#
# Deliberately NOT triggered on push/pull_request: this is minutes-slower and provisions real
# infrastructure, which doesn't belong on every commit. Runs nightly, on demand, and optionally
# when a release tag is pushed (a real signal that this exact commit is about to ship).

on:
  workflow_dispatch: {}
  schedule:
    # 03:00 UTC daily. GitHub Actions schedules only fire from the default branch.
    - cron: "0 3 * * *"
  push:
    tags:
      - "v*"

concurrency:
  group: integration
  cancel-in-progress: false # never cancel a real infra run partway through

jobs:
  integration:
    name: Full stack against real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Install project (for the pytest step, run outside the containers)
        run: uv sync --frozen

      - uses: docker/setup-buildx-action@v3

      # Real .env, from GitHub Secrets -- see docs/ci-cd.md for the full list. Postgres/LLM
      # values fall back to a CI-only placeholder if the corresponding secret isn't configured,
      # so this workflow still runs (against a real, if freshly-provisioned, database) on a
      # repo that hasn't set every secret up yet; a missing LLM_API_KEY degrades the live-stack
      # LLM check below to "backend returns a well-formed failure," not a hard workflow failure
      # -- pytest's own integration suite mocks the LLM transport regardless and needs no key.
      - name: Write .env from secrets
        run: |
          cat <<EOF > .env
          APP_NAME="Text-to-SQL Analytics Engine"
          APP_ENV=test
          APP_DEBUG=false
          APP_HOST=0.0.0.0
          APP_PORT=8000
          API_V1_PREFIX=/api/v1
          FRONTEND_PORT=8080
          LOG_LEVEL=INFO
          LOG_FORMAT=json
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'querymind' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'ci-integration-placeholder' }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'querymind' }}
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          DATABASE_POOL_SIZE=10
          DATABASE_MAX_OVERFLOW=5
          DATABASE_POOL_TIMEOUT=30
          DATABASE_ECHO=false
          LLM_PROVIDER=claude
          LLM_MODEL=claude-sonnet-5
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_TEMPERATURE=0.0
          LLM_MAX_TOKENS=4096
          LLM_TIMEOUT_SECONDS=30
          LLM_RETRY_COUNT=3
          LLM_BASE_URL=https://api.anthropic.com
          EOF

      - name: Start the stack (db -> app -> frontend)
        run: docker compose up -d --build

      - name: Wait for PostgreSQL to become healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q db)")
            echo "db: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "::error::PostgreSQL never became healthy" && exit 1

      - name: Wait for the backend health endpoint
        # Phase 22D-6: `app` no longer publishes a host port at all (hardened -- see
        # docker-compose.yml's own comment), so this can no longer curl `localhost:8000`
        # directly from the runner; `docker compose exec` runs the check *inside* the `app`
        # container instead, against its own loopback -- reachable regardless of host
        # publishing, and mirrors Dockerfile.backend's own HEALTHCHECK (`python -c
        # "import urllib.request..."`, since the image has neither curl nor wget).
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q app)")
            echo "app: $status"
            if [ "$status" = "healthy" ] && docker compose exec -T app python -c "
          import urllib.request
          urllib.request.urlopen('http://localhost:8000/api/v1/health/live').read()
          " >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend never became healthy" && exit 1

      - name: Wait for the frontend health endpoint
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q frontend)")
            echo "frontend: $status"
            if [ "$status" = "healthy" ] && curl -sf http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Frontend never became healthy" && exit 1

      - name: Real PostgreSQL + streaming integration tests
        # No exclusions here (contrast backend.yml) -- this is exactly the suite Fast CI
        # deliberately skips: every tests/**/test_integration.py file plus the individually
        # DB-dependent tests documented in backend.yml, run for real against the Postgres this
        # job just started. Runs on the GitHub Actions runner directly (not inside a
        # container), against the stack's published Postgres port -- the same way local
        # development already runs `uv run pytest` against a `docker compose`-provisioned
        # database (see docs/getting-started.md).
        run: uv run pytest -q

      - name: Validate Docker networking (app reachable from frontend; nginx proxies identically)
        # Phase 22D-6: `app:8000` is internal-only now, so "direct" access is exercised from
        # *inside* the `frontend` container (over the `querymind` network, the same path nginx
        # itself uses) rather than from the runner -- proves both that `app` is reachable by
        # hostname from another container (DNS + connectivity) and that nginx's proxy returns
        # byte-identical output to hitting `app` directly, without ever assuming host port 8000
        # is reachable (see the new "Verify the backend is not reachable from the host" step
        # right below, which proves the opposite on purpose).
        run: |
          internal=$(docker compose exec -T frontend curl -sf http://app:8000/api/v1/health/live)
          proxied=$(curl -sf http://localhost:8080/api/v1/health/live)
          if [ "$internal" != "$proxied" ]; then
            echo "::error::Response via the frontend reverse proxy differs from app:8000 directly (from inside the frontend container)"
            echo "internal: $internal"
            echo "proxied:  $proxied"
            exit 1
          fi
          echo "Frontend -> backend proxying confirmed identical to a direct in-network request."

      - name: Verify the backend is NOT reachable directly from the host
        # The core acceptance criterion of Phase 22D-6: `app` must not answer on the runner's
        # own localhost:8000 at all -- only via the frontend proxy (:8080) or from another
        # container on the `querymind` network (proven above). A short --max-time bounds this
        # in case the port is unexpectedly open and slow to respond, rather than hanging.
        run: |
          if curl -sf --max-time 3 http://localhost:8000/api/v1/health/live >/dev/null 2>&1; then
            echo "::error::Backend responded on host port 8000 -- it must only be reachable via the frontend proxy or the Docker network (Phase 22D-6)."
            exit 1
          fi
          echo "Confirmed: host port 8000 is not reachable from the runner (expected -- app is internal-only)."

      - name: Create a CI test user and obtain an access token
        # Phase 22D-7: both streaming endpoints require at least the `analyst` role
        # (`querymind.streaming.sse`/`.websocket`) -- the two validation steps below were
        # calling them with no credential at all and would have failed the moment RBAC was
        # added to these routes. Uses the project's own registration/login flow (a fresh
        # account is created and every registered account defaults to `analyst`, per
        # `AuthenticationService.register_user`/`README.md`'s own "Authorization" section) --
        # no GitHub secret needed, since this is disposable, per-run data torn down with the
        # rest of the stack (`docker compose down -v` at the end of this job). The username is
        # suffixed with the run/attempt id so two concurrent or retried runs never collide.
        # `::add-mask::` stops the token from ever appearing in this job's own logs, even if a
        # later step happens to print a response body that contains it.
        run: |
          username="ci_streaming_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"$username\", \"email\": \"$username@example.com\", \"password\": \"ci-streaming-test-password-1\"}" \
            >/dev/null
          access_token=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"$username\", \"password\": \"ci-streaming-test-password-1\"}" \
            | python -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$access_token"
          echo "ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"

      - name: Validate the SSE endpoint (through the reverse proxy)
        run: |
          frame=$(timeout 15 curl -N -sS -X POST http://localhost:8080/api/v1/query/stream \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{"question": "How many rows are in the customers table?"}' | head -n 5)
          echo "$frame"
          echo "$frame" | grep -q "^event: pipeline_started" || { echo "::error::No pipeline_started SSE frame received"; exit 1; }

      - name: Validate the WebSocket endpoint (through the reverse proxy)
        # `?token=` -- the browser's native WebSocket can't set an Authorization header, so
        # `querymind.streaming.websocket._authenticate_and_authorize` accepts the token this way
        # too; the frontend client (`services/streaming.ts`) uses the exact same mechanism.
        run: |
          uv run python -c "
          import asyncio, json, os, sys, websockets

          async def main() -> None:
              token = os.environ['ACCESS_TOKEN']
              async with websockets.connect(f'ws://localhost:8080/ws/query?token={token}') as ws:
                  await ws.send(json.dumps({'question': 'How many rows are in the customers table?'}))
                  first = json.loads(await asyncio.wait_for(ws.recv(), timeout=10))
                  if first['event_type'] != 'pipeline_started':
                      print(f'::error::Expected pipeline_started, got {first[\"event_type\"]}')
                      sys.exit(1)
                  print('WebSocket proxy confirmed: received', first['event_type'])

          asyncio.run(main())
          "

      - name: Collect Compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down (including the Postgres volume -- this run's data is disposable)
        if: always()
        run: docker compose down -v