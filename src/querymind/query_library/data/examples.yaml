  - id: payment_success_rate
    title: Payment Success Rate
    natural_language_question: "What percentage of payments were successfully captured?"
    normalized_question: "what percentage of payments were successfully captured"
    query_context:
      intent: aggregation
      primary_entity: payment
      metrics: ["payment_success_rate"]
      aggregation: average
    business_concepts: ["payment_success_rate"]
    linked_schema_objects: ["payments.payment_status"]
    gold_sql: |
      SELECT
          ROUND(
              100.0 * COUNT(*) FILTER (WHERE payment_status = 'captured') / COUNT(*),
              2
          ) AS payment_success_rate_pct
      FROM payments;
    sql_explanation: >-
      Divides the count of captured payments by the count of all
      payment attempts, expressed as a percentage.
    difficulty: intermediate
    tags: ["payments", "financial-metrics", "aggregation"]
    dialect: postgresql
    expected_result_description: "A single percentage: the share of payment attempts that were captured."
    expected_result_shape: scalar
    common_variations:
      - "How often do payments succeed?"
    notes: "Uses PostgreSQL's FILTER clause; an ANSI-portable version would use a CASE expression inside SUM/COUNT instead."

  - id: failed_payments_last_week
    title: Failed Payments in the Last Week
    natural_language_question: "List all failed payments from the last week."
    normalized_question: "list all failed payments from the last week"
    query_context:
      intent: detail
      primary_entity: payment
    business_concepts: []
    linked_schema_objects:
      - "payments.payment_id"
      - "payments.order_id"
      - "payments.payment_status"
      - "payments.amount"
      - "payments.created_at"
    gold_sql: |
      SELECT payment_id, order_id, amount, payment_method, created_at
      FROM payments
      WHERE payment_status = 'failed'
        AND created_at >= NOW() - INTERVAL '7 days'
      ORDER BY created_at DESC;
    sql_explanation: "Filters payments to failed attempts from the trailing 7 days, most recent first."
    difficulty: beginner
    tags: ["payments", "filtering", "time-based"]
    dialect: postgresql
    expected_result_description: "One row per failed payment from the last 7 days."
    expected_result_shape: row_list
    common_variations:
