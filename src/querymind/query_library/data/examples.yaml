  - id: most_used_promotion
    title: Most Used Promotion
    natural_language_question: "Which promotion was used the most?"
    normalized_question: "which promotion was used the most"
    query_context:
      intent: top_n
      primary_entity: promotion
      aggregation: count
    business_concepts: ["promotion_usage"]
    linked_schema_objects: ["promotions.promotion_id", "promotions.promotion_name", "orders.promotion_id"]
    gold_sql: |
      SELECT
          pr.promotion_id,
