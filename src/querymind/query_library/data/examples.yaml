  - id: products_below_reorder_level
    title: Products Below Reorder Level
    natural_language_question: "Which products are below their reorder level?"
    normalized_question: "which products are below their reorder level"
    query_context:
      intent: detail
      primary_entity: product
      dimensions: ["stock_availability"]
    business_concepts: ["stock_availability"]
    linked_schema_objects:
      - "inventory.product_id"
      - "inventory.warehouse_id"
      - "inventory.quantity_on_hand"
      - "inventory.reorder_level"
      - "products.product_name"
    gold_sql: |
      SELECT
          p.product_id,
          p.product_name,
          i.warehouse_id,
          i.quantity_on_hand,
          i.reorder_level
      FROM inventory i
      JOIN products p ON p.product_id = i.product_id
      WHERE i.quantity_on_hand < i.reorder_level
      ORDER BY (i.reorder_level - i.quantity_on_hand) DESC;
    sql_explanation: >-
      Joins inventory rows to their product and filters to rows where
      the quantity on hand has fallen below the configured reorder
      level, worst shortfall first.
    difficulty: intermediate
    tags: ["inventory", "products", "filtering", "joins"]
    dialect: postgresql
    expected_result_description: "One row per (product, warehouse) pair that needs restocking."
    expected_result_shape: row_list
    common_variations:
      - "Show products that need restocking."
      - "What's running low in inventory?"
    notes: null

  - id: total_inventory_value
    title: Total Inventory Value
    natural_language_question: "What is the total value of inventory on hand?"
    normalized_question: "what is the total value of inventory on hand"
    query_context:
      intent: sum
      primary_entity: inventory
      metrics: ["inventory_value"]
      aggregation: sum
    business_concepts: ["inventory_value"]
    linked_schema_objects: ["inventory.quantity_on_hand", "inventory.product_id", "products.cost_price"]
    gold_sql: |
      SELECT
          SUM(i.quantity_on_hand * p.cost_price) AS total_inventory_value
      FROM inventory i
      JOIN products p ON p.product_id = i.product_id;
    sql_explanation: >-
      Joins each inventory row to its product's cost price, multiplies
      quantity on hand by cost, and sums across every (product,
      warehouse) row.
    difficulty: advanced
    tags: ["inventory", "products", "financial-metrics", "joins", "aggregation"]
    dialect: postgresql
    expected_result_description: "A single number: the total cost value of all inventory currently held."
    expected_result_shape: scalar
    common_variations:
      - "How much is our warehouse stock worth?"
    notes: null

  - id: distinct_products_per_warehouse
    title: Distinct Products Stocked per Warehouse
    natural_language_question: "How many distinct products are stocked at each warehouse?"
    normalized_question: "how many distinct products are stocked at each warehouse"
    query_context:
      intent: aggregation
      primary_entity: warehouse
      dimensions: ["warehouse"]
      aggregation: count
    business_concepts: ["warehouse_capacity"]
    linked_schema_objects:
      - "warehouses.warehouse_id"
      - "warehouses.warehouse_code"
      - "inventory.warehouse_id"
      - "inventory.product_id"
    gold_sql: |
      SELECT
          w.warehouse_id,
          w.warehouse_code,
          COUNT(DISTINCT i.product_id) AS distinct_products
      FROM warehouses w
      JOIN inventory i ON i.warehouse_id = w.warehouse_id
      GROUP BY w.warehouse_id, w.warehouse_code
      ORDER BY distinct_products DESC;
    sql_explanation: "Joins warehouses to their inventory rows and counts distinct products per warehouse."
    difficulty: intermediate
    tags: ["warehouses", "inventory", "grouping", "joins"]
    dialect: postgresql
    expected_result_description: "One row per warehouse with how many distinct products it stocks."
    expected_result_shape: row_list
    common_variations: []
    notes: null

  - id: average_shipment_delivery_time
    title: Average Shipment Delivery Time
    natural_language_question: "What is the average time between shipping and delivery?"
    normalized_question: "what is the average time between shipping and delivery"
    query_context:
      intent: average
      primary_entity: shipment
      metrics: ["shipment_delay"]
      aggregation: average
    business_concepts: ["shipment_delay"]
    linked_schema_objects: ["shipments.shipped_at", "shipments.delivered_at"]
    gold_sql: |
      SELECT
          ROUND(AVG(EXTRACT(EPOCH FROM (delivered_at - shipped_at)) / 86400.0), 2) AS avg_delivery_days
      FROM shipments
      WHERE delivered_at IS NOT NULL AND shipped_at IS NOT NULL;
    sql_explanation: >-
      Computes the delivered-minus-shipped interval for every completed
      shipment, converts it to days, and averages across all of them.
    difficulty: intermediate
    tags: ["shipments", "aggregation"]
    dialect: postgresql
    expected_result_description: "A single number: the average number of days from shipped to delivered."
    expected_result_shape: scalar
    common_variations:
      - "How long does delivery usually take after shipping?"
    notes: "PostgreSQL-specific: EXTRACT(EPOCH FROM interval) converts the shipped/delivered gap to seconds before dividing into days."

