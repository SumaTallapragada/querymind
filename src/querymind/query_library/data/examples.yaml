  - id: repeat_customer_rate
    title: Repeat Customer Rate
    natural_language_question: "What percentage of customers have placed more than one order?"
    normalized_question: "what percentage of customers have placed more than one order"
    query_context:
      intent: aggregation
      primary_entity: customer
      metrics: ["repeat_customer"]
      aggregation: average
    business_concepts: ["repeat_customer"]
    linked_schema_objects: ["customers.customer_id", "orders.customer_id", "orders.order_id"]
    gold_sql: |
      WITH order_counts AS (
          SELECT customer_id, COUNT(*) AS order_count
          FROM orders
          GROUP BY customer_id
      )
      SELECT
          ROUND(
              100.0 * COUNT(*) FILTER (WHERE order_count > 1) / COUNT(*),
              2
          ) AS repeat_customer_rate_pct
      FROM order_counts;
    sql_explanation: >-
      Counts orders per customer in a CTE, then computes what
      percentage of customers (who placed at least one order) placed
      more than one.
    difficulty: advanced
    tags: ["customers", "orders", "aggregation", "financial-metrics"]
    dialect: postgresql
    expected_result_description: "A single percentage: the share of ordering customers who are repeat buyers."
    expected_result_shape: scalar
    common_variations:
      - "How many of our customers come back for a second order?"
    notes: >-
      Only counts customers who have placed at least one order;
      customers with zero orders never appear in order_counts and so
      are excluded from the denominator by construction.
