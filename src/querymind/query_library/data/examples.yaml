  - id: low_rated_products
    title: Products Rated Below 3 Stars on Average
    natural_language_question: "Which products have an average rating below 3?"
    normalized_question: "which products have an average rating below 3"
    query_context:
      intent: detail
      primary_entity: product
      metrics: ["review_rating"]
      dimensions: ["product"]
      aggregation: average
    business_concepts: ["review_rating"]
    linked_schema_objects: ["products.product_id", "products.product_name", "product_reviews.product_id", "product_reviews.rating"]
    gold_sql: |
      SELECT
          p.product_id,
          p.product_name,
          ROUND(AVG(pr.rating), 2) AS average_rating
      FROM products p
      JOIN product_reviews pr ON pr.product_id = p.product_id
      GROUP BY p.product_id, p.product_name
      HAVING AVG(pr.rating) < 3
      ORDER BY average_rating ASC;
    sql_explanation: >-
      Same shape as the per-product average rating, but filtered with
      HAVING (since the filter is on the aggregate, not a raw column)
      to only the products below a 3-star average.
    difficulty: advanced
    tags: ["reviews", "products", "filtering", "grouping", "aggregation", "joins"]
    dialect: postgresql
    expected_result_description: "One row per underperforming product, worst-rated first."
    expected_result_shape: row_list
    common_variations:
      - "Show our worst-reviewed products."
    notes: "Uses HAVING because the filter applies to an aggregate (the average), not a raw column."

  - id: return_rate_by_category
    title: Return Rate by Product Category
    natural_language_question: "What is the return rate by product category?"
    normalized_question: "what is the return rate by product category"
    query_context:
      intent: aggregation
      primary_entity: product
      metrics: ["return_rate"]
      dimensions: ["category"]
      aggregation: average
    business_concepts: ["return_rate"]
    linked_schema_objects:
      - "product_categories.category_name"
      - "products.category_id"
      - "order_items.product_id"
      - "order_items.order_item_id"
      - "returns.order_item_id"
    gold_sql: |
      SELECT
          pc.category_name,
          COUNT(DISTINCT r.return_id) AS returned_items,
          COUNT(DISTINCT oi.order_item_id) AS total_items,
          ROUND(
              100.0 * COUNT(DISTINCT r.return_id) / NULLIF(COUNT(DISTINCT oi.order_item_id), 0),
              2
          ) AS return_rate_pct
      FROM order_items oi
      JOIN products p ON p.product_id = oi.product_id
      JOIN product_categories pc ON pc.category_id = p.category_id
      LEFT JOIN returns r ON r.order_item_id = oi.order_item_id
      GROUP BY pc.category_name
      ORDER BY return_rate_pct DESC;
    sql_explanation: >-
      Left-joins order items to any matching return so items with no
      return still count toward the denominator, then divides returned
      line items by total line items per category.
    difficulty: advanced
    tags: ["returns", "products", "financial-metrics", "grouping", "joins", "aggregation"]
    dialect: postgresql
    expected_result_description: "One row per category with its return rate, highest first."
    expected_result_shape: row_list
    common_variations:
      - "Which category has the most returns?"
    notes: "NULLIF guards against divide-by-zero for a category with no order_items at all."

  - id: monthly_revenue_trend
    title: Monthly Revenue Trend (Past Year)
    natural_language_question: "Show monthly revenue for the past year."
    normalized_question: "show monthly revenue for the past year"
    query_context:
      intent: trend
      primary_entity: order
      metrics: ["revenue"]
      dimensions: ["month"]
      aggregation: sum
    business_concepts: ["revenue"]
    linked_schema_objects: ["orders.order_date", "orders.total_amount"]
    gold_sql: |
      SELECT
          DATE_TRUNC('month', order_date) AS month,
          SUM(total_amount) AS monthly_revenue
      FROM orders
      WHERE order_date >= NOW() - INTERVAL '1 year'
      GROUP BY DATE_TRUNC('month', order_date)
      ORDER BY month;
    sql_explanation: "Buckets orders from the last 12 months by calendar month and sums revenue per bucket."
    difficulty: advanced
    tags: ["orders", "financial-metrics", "trend-analysis", "time-based", "grouping"]
    dialect: postgresql
    expected_result_description: "One row per month, ordered chronologically, with that month's total revenue."
    expected_result_shape: time_series
    common_variations:
      - "How has revenue trended over the last 12 months?"
    notes: null

  - id: revenue_year_over_year_growth
    title: Year-over-Year Revenue Growth
    natural_language_question: "What was our year-over-year revenue growth?"
    normalized_question: "what was our year-over-year revenue growth"
    query_context:
      intent: trend
      primary_entity: order
      metrics: ["revenue"]
      dimensions: ["year"]
      aggregation: sum
    business_concepts: ["revenue"]
    linked_schema_objects: ["orders.order_date", "orders.total_amount"]
    gold_sql: |
      WITH yearly_revenue AS (
          SELECT
              DATE_TRUNC('year', order_date) AS year,
              SUM(total_amount) AS revenue
          FROM orders
          GROUP BY DATE_TRUNC('year', order_date)
      )
      SELECT
          year,
          revenue,
          LAG(revenue) OVER (ORDER BY year) AS previous_year_revenue,
          ROUND(
              100.0 * (revenue - LAG(revenue) OVER (ORDER BY year))
                  / NULLIF(LAG(revenue) OVER (ORDER BY year), 0),
              2
          ) AS yoy_growth_pct
      FROM yearly_revenue
      ORDER BY year;
    sql_explanation: >-
      Aggregates revenue per calendar year in a CTE, then uses the LAG
      window function to compare each year against the prior year's
      revenue in the same query.
    difficulty: expert
    tags: ["orders", "financial-metrics", "trend-analysis", "time-based"]
    dialect: postgresql
    expected_result_description: "One row per year with its revenue and percentage growth over the prior year."
    expected_result_shape: time_series
    common_variations:
      - "Is our revenue growing year over year?"
    notes: "Uses a window function (LAG) to compare each year's revenue against the prior year within one query."

  - id: average_order_value_trend
    title: Average Order Value Trend by Month
    natural_language_question: "How has average order value changed month over month?"
    normalized_question: "how has average order value changed month over month"
    query_context:
      intent: trend
      primary_entity: order
      metrics: ["average_order_value"]
      dimensions: ["month"]
      aggregation: average
    business_concepts: ["average_order_value"]
    linked_schema_objects: ["orders.order_date", "orders.total_amount", "orders.order_id"]
    gold_sql: |
      SELECT
          DATE_TRUNC('month', order_date) AS month,
          ROUND(AVG(total_amount), 2) AS average_order_value
      FROM orders
      GROUP BY DATE_TRUNC('month', order_date)
      ORDER BY month;
    sql_explanation: "Buckets orders by calendar month and averages total_amount within each bucket."
    difficulty: advanced
    tags: ["orders", "financial-metrics", "trend-analysis", "time-based", "aggregation"]
    dialect: postgresql
    expected_result_description: "One row per month, ordered chronologically, with that month's average order value."
    expected_result_shape: time_series
    common_variations:
      - "Is AOV trending up or down?"
    notes: null

