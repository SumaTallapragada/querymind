# Query Intelligence Library for QueryMind.
#
# The editable source of truth for curated, gold-standard
# natural-language-question-to-SQL examples — never hardcoded into
# Python. Loaded at runtime by querymind.query_library.loader /
# querymind.query_library.catalog.
#
# `linked_schema_objects` are *logical* references ("table" or
# "table.column"), and `query_context` is a hand-authored summary, not a
# live querymind.nlu.QueryContext — this file (and the package that
# loads it) has no runtime dependency on the NLU Engine, Schema Linker,
# or Metadata Engine. `business_concepts` reference
# querymind.business_knowledge concept ids where one exists.
#
# Every gold_sql is written for PostgreSQL (querymind's own database)
# unless a different `dialect` is set.
#
# Schema:
#   examples:
#     - id: <str, unique, stable>
#       title: <str>
#       natural_language_question: <str>
#       normalized_question: <str>
#       query_context: {intent, primary_entity, metrics, dimensions, aggregation}
#       business_concepts: [<str>, ...]
#       linked_schema_objects: [<str>, ...]
#       gold_sql: <str>
#       sql_explanation: <str>
#       difficulty: beginner | intermediate | advanced | expert
#       tags: [<str>, ...]
#       dialect: postgresql | mysql | sqlite | ansi
#       expected_result_description: <str>
#       expected_result_shape: scalar | single_row | row_list | time_series | ranked_list
#       common_variations: [<str>, ...]
#       notes: <str> | null

examples:
  - id: customer_count
    title: Total Customer Count
    natural_language_question: "How many customers do we have?"
    normalized_question: "how many customers do we have"
    query_context:
      intent: count
      primary_entity: customer
      aggregation: count
    business_concepts: []
    linked_schema_objects: ["customers.customer_id"]
    gold_sql: "SELECT COUNT(*) AS customer_count FROM customers;"
    sql_explanation: "Counts every row in the customers table."
    difficulty: beginner
    tags: ["customers", "aggregation"]
    dialect: postgresql
    expected_result_description: "A single number: the total number of customer accounts."
    expected_result_shape: scalar
    common_variations:
      - "What is our total customer count?"
      - "Count all customers."
    notes: null

  - id: top_customers_by_revenue
    title: Top 10 Customers by Revenue
    natural_language_question: "Who are our top 10 customers by total revenue?"
    normalized_question: "who are our top 10 customers by total revenue"
    query_context:
      intent: top_n
      primary_entity: customer
      metrics: ["revenue"]
      aggregation: sum
    business_concepts: ["revenue", "top_customer"]
    linked_schema_objects:
      - "customers.customer_id"
      - "customers.first_name"
      - "customers.last_name"
      - "orders.customer_id"
      - "orders.total_amount"
    gold_sql: |
      SELECT
          c.customer_id,
          c.first_name,
          c.last_name,
          SUM(o.total_amount) AS total_revenue
      FROM customers c
      JOIN orders o ON o.customer_id = c.customer_id
      GROUP BY c.customer_id, c.first_name, c.last_name
      ORDER BY total_revenue DESC
      LIMIT 10;
    sql_explanation: >-
      Joins customers to their orders, sums total_amount per customer,
      and returns the 10 highest spenders.
    difficulty: intermediate
    tags: ["customers", "orders", "top-n", "aggregation", "joins", "financial-metrics"]
    dialect: postgresql
    expected_result_description: >-
      Up to 10 rows, one per customer, each with their id, name, and
      lifetime revenue, ranked highest first.
    expected_result_shape: ranked_list
    common_variations:
      - "Show our best customers by spend."
      - "List the top 10 highest-spending customers."
    notes: "Orders in every status are included; a stricter version might filter to non-cancelled orders."

