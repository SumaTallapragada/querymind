  - id: revenue_by_category
    title: Revenue by Product Category
    natural_language_question: "Show total revenue by product category."
    normalized_question: "show total revenue by product category"
    query_context:
      intent: aggregation
      primary_entity: product
      metrics: ["revenue"]
      dimensions: ["category"]
      aggregation: sum
    business_concepts: ["revenue"]
    linked_schema_objects:
      - "product_categories.category_name"
      - "products.category_id"
      - "order_items.product_id"
      - "order_items.line_total"
    gold_sql: |
      SELECT
          pc.category_name,
          SUM(oi.line_total) AS category_revenue
      FROM order_items oi
      JOIN products p ON p.product_id = oi.product_id
      JOIN product_categories pc ON pc.category_id = p.category_id
      GROUP BY pc.category_name
      ORDER BY category_revenue DESC;
    sql_explanation: >-
      Joins order line items to their product and category, then sums
      line_total (the actual line-level revenue) per category.
    difficulty: intermediate
    tags: ["products", "grouping", "joins", "financial-metrics", "aggregation"]
    dialect: postgresql
    expected_result_description: "One row per product category with its total revenue, highest first."
    expected_result_shape: row_list
    common_variations:
      - "Which category generates the most revenue?"
    notes: null

