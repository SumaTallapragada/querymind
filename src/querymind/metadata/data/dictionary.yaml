# Business metadata for the QueryMind schema.
#
# This file is the independent metadata source referenced throughout the
# Metadata Engine: it is never hardcoded into the ORM models
# (src/querymind/models/) and is loaded at runtime by
# querymind.metadata.loader / querymind.metadata.dictionary.
#
# Content is transcribed verbatim from the approved Phase 2 design
# document (docs/phase2_database_design.md, Section 5 "Data Dictionary"
# and Section 3 table purposes) — it is already-approved business content
# being re-encoded into a machine-readable source, not new authorship.
#
# Schema:
#   tables:
#     <table_name>:
#       description: <str>
#       synonyms: [<str>, ...]
#   columns:
#     <table_name>.<column_name>:
#       description: <str>
#       example_value: <str> | null
#       synonyms: [<str>, ...]
#       display_name: <str>
#       search_keywords: [<str>, ...]
#       is_sensitive: <bool>

tables:
  customers:
    description: "One row per registered customer account — the anchor entity for all customer analytics (lifetime value, segmentation, retention)."
    synonyms: ["clients", "buyers", "accounts", "customer base"]
  customer_addresses:
    description: "A customer's saved address book (billing/shipping defaults for autofill and customer-geography analytics)."
    synonyms: ["addresses", "address book", "shipping addresses", "billing addresses"]
  product_categories:
    description: "Self-referencing hierarchy for the product taxonomy (e.g. Electronics -> Computers -> Laptops)."
    synonyms: ["categories", "departments", "product taxonomy"]
  suppliers:
    description: "External vendors who manufacture/wholesale the products QueryMind resells."
    synonyms: ["vendors", "manufacturers", "providers"]
  products:
    description: "The sellable catalog item — the anchor entity for product/category/margin analytics."
    synonyms: ["catalog", "items", "SKUs", "merchandise"]
  warehouses:
    description: "Physical fulfillment centers that hold inventory and originate shipments."
    synonyms: ["fulfillment centers", "distribution centers", "DCs"]
  inventory:
    description: "Current stock level of one product at one warehouse — the anchor entity for inventory-health analytics."
    synonyms: ["stock", "stock levels", "on-hand inventory"]
  orders:
    description: "One row per customer order — the central fact table of the schema."
    synonyms: ["purchases", "sales", "transactions"]
  order_items:
    description: "One row per product line within an order."
    synonyms: ["line items", "order lines", "purchased items"]
  payments:
    description: "One row per payment transaction attempt against an order."
    synonyms: ["transactions", "charges", "payment transactions"]
  shipments:
    description: "One row per physical shipment fulfilling all or part of an order."
    synonyms: ["deliveries", "parcels", "fulfillments"]
  product_reviews:
    description: "Customer-authored product feedback, optionally linked to a verified purchase."
    synonyms: ["reviews", "ratings", "feedback"]
  promotions:
    description: "Discount codes/campaigns that can be applied to an order."
    synonyms: ["coupons", "discounts", "campaigns", "sales"]
  returns:
    description: "One row per return request against a purchased line item."
    synonyms: ["RMAs", "refund requests", "returned items"]

