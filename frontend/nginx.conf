# Phase 19A nginx config for the QueryMind frontend's production image (frontend/Dockerfile).
# Serves the static Vite build with SPA routing and gzip. The API/SSE/WebSocket proxy blocks
# below are intentionally commented out: this image must stay independently buildable and
# runnable on its own (`docker run` with no backend present), which a live `proxy_pass` to an
# unresolvable host would break at nginx startup. Wiring them up against a real backend
# hostname is Docker Compose networking -- out of scope for Phase 19A; see docs/docker.md.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these filenames with a content hash, so they're safe to cache
    # indefinitely -- a new build always ships under a new filename.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: any path that isn't a real static file falls back to index.html so
    # react-router-dom's client-side routes (/, /diagnostics, /health, /metrics, /settings)
    # all resolve on a hard refresh or direct link, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # --------------------------------------------------------------------------------------
    # Backend API proxy placeholder -- activate once a backend hostname is reachable
    # (Phase 19B Docker Compose network). Mirrors vite.config.ts's dev-server proxy.
    # --------------------------------------------------------------------------------------
    # location /api/ {
    #     proxy_pass http://backend:8000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # --------------------------------------------------------------------------------------
    # SSE proxy placeholder (POST /api/v1/query/stream) -- buffering/caching must stay off so
    # each `event:`/`data:` frame reaches the browser as the backend emits it, not batched.
    # --------------------------------------------------------------------------------------
    # location /api/v1/query/stream {
    #     proxy_pass http://backend:8000/api/v1/query/stream;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     proxy_cache off;
    #     chunked_transfer_encoding on;
    #     proxy_read_timeout 3600s;
    # }

    # --------------------------------------------------------------------------------------
    # WebSocket proxy placeholder (/ws/query) -- the Upgrade/Connection headers are what turn
    # this from a plain proxied HTTP request into a proxied WebSocket connection.
