# nginx config for the QueryMind frontend's production image (frontend/Dockerfile). Serves the
# static Vite build with SPA routing and gzip, and (as of Phase 19B) reverse-proxies REST, SSE,
# and WebSocket traffic to the backend -- `app`, the backend's actual service name in
# docker-compose.yml, not a placeholder.
#
# `proxy_pass` below targets a *variable* (`$upstream_app`), not a literal `app:8000` -- this
# is deliberate, not stylistic. A literal proxy_pass target is resolved once, at nginx's config
# load / startup, and if it doesn't resolve at that instant, nginx refuses to start at all
# (`host not found in upstream`), taking the entire frontend -- including the static app shell
# -- down with it. Routing through a variable, with an explicit `resolver`, makes resolution
# happen lazily per-request instead: nginx starts and serves the app shell regardless of whether
# `app` is reachable yet, a proxied request 502s only if `app` genuinely isn't up at that moment,
# and -- unlike the literal form -- it re-resolves every 30s, so it keeps working if the `app`
# container is ever recreated with a new IP without an nginx restart. `127.0.0.11` is Docker's
# embedded DNS server, always available on a Compose-managed (user-defined bridge) network.
# This also means the image is still safe to `docker run` completely standalone, with no
# Compose network at all -- it serves the app shell fine; only these three proxied routes 502
# until a reachable `app` exists, exactly like any reverse proxy with its upstream down.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

# Phase 22D: browser-facing security headers for the two locations below that actually serve
# HTML/JS/CSS the browser renders (the static-asset location and the SPA `location /`) -- never
# added to the `/api/`, `/api/v1/query/stream`, or `/ws/` proxy locations below, since those
# responses are the FastAPI backend's own (it adds its own headers via `SecurityHeadersMiddleware`;
# duplicating or second-guessing them here risks two different, possibly conflicting header
# values reaching the client on the same response).
#
# nginx only inherits a parent context's `add_header` directives into a location block that has
# *none of its own* -- both locations below already set their own `Cache-Control`, so every
# header needed there, including these, must be repeated explicitly in each one rather than
# declared once at the `server` level and assumed to apply everywhere.
#
# CSP is the one header genuinely specific to *this* build, not a generic default -- verified
# empirically (Phase 22D) against the actual production Vite bundle, in a real browser, rather
# than assumed:
#   default-src 'self'      -- everything not otherwise listed (the floor).
#   script-src 'self'       -- the production build has no inline <script> and needs no
#                              'unsafe-eval'; every script is a same-origin, content-hashed file.
#   connect-src 'self'      -- covers same-origin fetch/XHR (services/api.ts) *and* same-origin
#                              WebSocket (/ws/query) and SSE (/api/v1/query/stream) alike, since
#                              this app is always served same-origin with its own backend (this
#                              nginx proxies both under the same host:port the page loads from).
#   img-src 'self' data:    -- `data:` covers small inlined icons/placeholders a UI library may
#                              emit; nothing in this app loads a remote image.
#   style-src 'self'        -- empirically verified (Phase 22D) against the real production
#                              build in a real Chrome browser: login, dashboard, hard reload of
#                              /health, RBAC-blocked /diagnostics /metrics /settings, logout, and
#                              -- the real stress test -- opening the Streaming tab's Transport
#                              `Select`, a Radix UI floating popover that positions itself via
#                              inline `style`, all rendered correctly with zero CSP violations in
#                              the console. Radix sets that positioning through direct CSSOM
#                              property assignment (`element.style.top = ...`), which CSP's
#                              style-src never restricts (only the HTML `style` *attribute* on
#                              markup and `<style>` tags are) -- so `'unsafe-inline'` was never
#                              actually required and is deliberately left out.
#   frame-ancestors 'none'  -- this app is never meant to be framed by another site; the modern
#                              (CSP) replacement for X-Frame-Options, kept alongside it below for
#                              older-browser defense-in-depth.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    # Vite fingerprints these filenames with a content hash, so they're safe to cache
    # indefinitely -- a new build always ships under a new filename.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none';" always;
    }

    # SPA routing: any path that isn't a real static file falls back to index.html so
    # react-router-dom's client-side routes (/, /diagnostics, /health, /metrics, /settings,
    # /login) all resolve on a hard refresh or direct link, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none';" always;
    }

    # --------------------------------------------------------------------------------------
    # Backend REST API proxy. Mirrors vite.config.ts's dev-server proxy, against the real
    # Compose service now instead of localhost:8000. No URI segment after $upstream_app: with
    # a variable proxy_pass, nginx always forwards the original request URI unchanged (its
    # prefix-rewrite feature only applies to a literal target) -- and here that's exactly what
    # we want, since the frontend's /api/* paths already match the backend's own routes
    # 1:1, no rewriting needed.
    # --------------------------------------------------------------------------------------
    location /api/ {
        set $upstream_app app:8000;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------------------
    # SSE proxy (POST /api/v1/query/stream) -- a more specific prefix than /api/ above, so
    # nginx's longest-prefix-match picks this block for that one path regardless of
    # declaration order. Buffering/caching must stay off so each `event:`/`data:` frame
    # reaches the browser as the backend emits it, not batched until the response closes.
    # --------------------------------------------------------------------------------------
    location /api/v1/query/stream {
        set $upstream_app app:8000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # --------------------------------------------------------------------------------------
    # WebSocket proxy (/ws/query) -- the Upgrade/Connection headers are what turn this from a
    # plain proxied HTTP request into a proxied WebSocket connection.
    # --------------------------------------------------------------------------------------
    location /ws/ {
        set $upstream_app app:8000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}