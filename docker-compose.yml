services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The official postgres image reads these three exact variable names
      # for first-run initialization — they must match Settings.postgres_*
      # in src/querymind/core/config.py, which is why both are sourced from
      # the same .env file.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Compose network, the app reaches Postgres by service
      # name on Postgres's standard port — these override whatever
      # POSTGRES_HOST/POSTGRES_PORT are set to for local (non-Docker)
      # development in .env, which may point at a different host port to
      # avoid colliding with a Postgres already running on the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: