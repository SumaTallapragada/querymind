services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The official postgres image reads these three exact variable names
      # for first-run initialization — they must match Settings.postgres_*
      # in src/querymind/core/config.py, which is why both are sourced from
      # the same .env file.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - querymind

  app:
    build:
      context: .
      # Phase 19B: built from Dockerfile.backend (the Phase 19A production image with a
      # container-configurable listen port), not the legacy root Dockerfile it superseded —
      # its EXPOSE/HEALTHCHECK/CMD all read APP_PORT, which is why `healthcheck:` below keys
      # off ${APP_PORT} too, rather than a hardcoded 8000.
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Compose network, the app reaches Postgres by service
      # name on Postgres's standard port — these override whatever
      # POSTGRES_HOST/POSTGRES_PORT are set to for local (non-Docker)
      # development in .env, which may point at a different host port to
      # avoid colliding with a Postgres already running on the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    # Phase 22D-6: deliberately no `ports:` mapping here — the backend is no longer published
    # to the host at all. `expose` (unlike `ports`) never publishes a host port; it only
    # documents, for a human reading this file, which port other *containers* on the
    # `querymind` network reach this service on — Compose's own DNS-based service-to-service
    # networking already works without it (any container on this network can already reach
    # `app:8000` regardless of whether `expose` is declared), so this is pure
    # self-documentation, not a functional requirement. `frontend/nginx.conf` is the one and
    # only externally reachable entry point now (`${FRONTEND_PORT:-8080}` below); it proxies
    # `/api/*`, the SSE endpoint, and `/ws/*` to `app:8000` over this same internal network,
    # exactly as it already did — nothing about that proxying, or the app's own
    # `0.0.0.0:${APP_PORT:-8000}` bind inside the container, changes here. See
    # docs/docker.md's "Docker Compose" section for the full rationale (single controlled
    # ingress, consistent security headers, one IP-based rate-limiting path, backend isolated
    # on the Docker network).
    expose:
      - "${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${APP_PORT:-8000}/api/v1/health/live').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - querymind

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      # Not just "container running" -- nginx.conf's proxy_pass targets resolve the `app`
      # hostname once, at nginx startup; without waiting for `app` to be healthy (i.e.
      # actually serving on the Compose network, not merely started), nginx could start before
      # `app`'s DNS entry / listening socket exists.
      app:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost -- see the Phase 19A healthcheck fix in frontend/Dockerfile;
      # this mirrors that same fix at the Compose level.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - querymind

volumes:
  postgres_data:

networks:
  querymind:
    driver: bridge