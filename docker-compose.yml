services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The official postgres image reads these three exact variable names
      # for first-run initialization — they must match Settings.postgres_*
      # in src/querymind/core/config.py, which is why both are sourced from
      # the same .env file.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - querymind

  app:
    build:
      context: .
      # Phase 19B: built from Dockerfile.backend (the Phase 19A production image with a
      # container-configurable listen port), not the legacy root Dockerfile it superseded —
      # its EXPOSE/HEALTHCHECK/CMD all read APP_PORT, which is why `ports:` and `healthcheck:`
      # below both key off ${APP_PORT} too, rather than a hardcoded 8000.
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Compose network, the app reaches Postgres by service
      # name on Postgres's standard port — these override whatever
      # POSTGRES_HOST/POSTGRES_PORT are set to for local (non-Docker)
      # development in .env, which may point at a different host port to
      # avoid colliding with a Postgres already running on the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      # Both sides must move together: Dockerfile.backend's uvicorn actually binds to
      # $APP_PORT inside the container now (unlike the legacy Dockerfile, which always bound
      # 8000 regardless of APP_PORT) — mapping to a hardcoded container-side 8000 here would
      # silently break if APP_PORT were ever changed away from its default.
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${APP_PORT:-8000}/api/v1/health/live').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - querymind

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      # Not just "container running" -- nginx.conf's proxy_pass targets resolve the `app`
      # hostname once, at nginx startup; without waiting for `app` to be healthy (i.e.
      # actually serving on the Compose network, not merely started), nginx could start before
      # `app`'s DNS entry / listening socket exists.
      app:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost -- see the Phase 19A healthcheck fix in frontend/Dockerfile;
      # this mirrors that same fix at the Compose level.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - querymind

volumes:
  postgres_data:

networks:
  querymind:
    driver: bridge